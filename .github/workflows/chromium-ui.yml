name: Chromium UI checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-package-lock
      - name: Install Chromium
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Start Next.js frontend
        working-directory: frontend
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/sentinelai-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/sentinelai-frontend.log
          exit 1
      - name: Run Chromium checks
        run: python -m pytest -q tests/browser
        env:
          SENTINELAI_BASE_URL: http://127.0.0.1:3000
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sentinelai-browser-diagnostics
          path: /tmp/sentinelai-frontend.log
          if-no-files-found: ignore
