databases:
  - name: sentinelai-db
    plan: free
    region: frankfurt
    databaseName: sentinelai
    user: sentinelai

services:
  - type: web
    name: sentinelai-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelai-db
          property: connectionString
      - key: API_KEY
        generateValue: true

  - type: web
    name: sentinelai-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://sentinelai-api.onrender.com
